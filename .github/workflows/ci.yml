name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v6

      # pnpm 的版本取自根 package.json 的 packageManager 字段，不在这里写死
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: 统一质量门禁
        run: pnpm check
      - run: pnpm test:coverage
        if: matrix.node-version == 24
      - name: 验证发布包契约
        run: pnpm --filter optik-sol pack --dry-run
      - name: 检查补丁格式
        run: git diff --check

      - name: 检查构建产物
        run: |
          test -s packages/optik/dist/optik.global.js
          test -s packages/optik/dist/optik.js
          test -s packages/optik/dist/index.d.ts
          test -s docs/.vitepress/dist/index.html
          test -s docs/.vitepress/dist/en/index.html
