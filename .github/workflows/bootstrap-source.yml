name: Bootstrap source

on:
  push:
    branches: [main]
    paths:
      - optik-sol-source.zip.b64
      - .github/workflows/bootstrap-source.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore repository source
        run: |
          base64 --decode optik-sol-source.zip.b64 > optik-sol-source.zip
          unzip -o optik-sol-source.zip
          rm optik-sol-source.zip optik-sol-source.zip.b64
          rm .github/workflows/bootstrap-source.yml
      - name: Commit restored source
        run: |
          git config user.name Moresyl
          git config user.email xd@biekanle.com
          git add -A
          git commit -m "feat: 发布 Optik Sol 开源代码"
          git push
