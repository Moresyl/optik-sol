name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@^11.5.1

      - name: Verify the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const manifests = [
            'packages/core/package.json',
            'packages/ui/package.json',
            'packages/optik/package.json',
          ].map((path) => JSON.parse(readFileSync(path, 'utf8')));
          const versions = new Set(manifests.map(({ version }) => version));

          if (versions.size !== 1) {
            console.error('All published packages must use the same version.');
            process.exit(1);
          }

          const [version] = versions;
          const expectedTag = `v${version}`;
          if (process.env.RELEASE_TAG !== expectedTag) {
            console.error(
              `Release tag ${process.env.RELEASE_TAG} does not match package version ${version}.`,
            );
            process.exit(1);
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify and build release artifacts
        run: |
          pnpm build
          pnpm typecheck

      - name: Pack npm packages
        run: |
          mkdir artifacts
          pnpm --filter optik-core pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter optik-ui pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter optik-debug pack --pack-destination "$GITHUB_WORKSPACE/artifacts"

      - name: Publish npm packages with provenance
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          for package_name in optik-core optik-ui optik-debug; do
            if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
              echo "${package_name}@${version} is already published; skipping."
              continue
            fi
            npm publish "artifacts/${package_name}-${version}.tgz" --access public --provenance
          done
