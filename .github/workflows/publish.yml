name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@^11.5.1

      - name: Verify the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('packages/optik/package.json', 'utf8'));
          const expectedTag = `v${version}`;
          if (process.env.RELEASE_TAG !== expectedTag) {
            console.error(
              `Release tag ${process.env.RELEASE_TAG} does not match package version ${version}.`,
            );
            process.exit(1);
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify and build release artifacts
        run: |
          pnpm build
          pnpm typecheck

      - name: Pack npm packages
        run: |
          mkdir artifacts
          pnpm --filter optik-sol pack --pack-destination "$GITHUB_WORKSPACE/artifacts"

      - name: Publish npm package with provenance
        run: |
          version="$(node -p "require('./packages/optik/package.json').version")"
          if npm view "optik-sol@${version}" version >/dev/null 2>&1; then
            echo "optik-sol@${version} is already published; skipping."
            exit 0
          fi
          npm publish "./artifacts/optik-sol-${version}.tgz" --access public --provenance
